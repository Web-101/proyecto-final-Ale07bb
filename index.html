<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Cartelera oficial de CINESTAR. Encuentra las mejores películas y estrenos en tu cine local.">
  <title>CINESTAR - Cartelera Oficial</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@400;600;900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <script src="js/cartelera.js" defer></script>
</head>

<body>

  <!-- HEADER -->
  <header class="main-header">
    <div class="header-logo" id="logotipo-encabezado">CINESTAR</div>
  </header>

  <!-- MAIN CONTENT -->
  <main>
    <section class="section-cartelera" aria-labelledby="titulo-seccion-cartelera">
      <h1 class="section-title" id="titulo-seccion-cartelera">CARTELERA</h1>

      <div class="grid-peliculas" id="contenedor-peliculas">
        <p class="mensaje-cartelera">Cargando cartelera...</p>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="main-footer">
    <div class="footer-logo" id="logotipo-pie-id">CINESTAR</div>
    <nav class="footer-nav" aria-label="Enlaces del pie de página">
      <a href="#" id="enlace-pie-privacidad">Política de Privacidad</a>
      <a href="#" id="enlace-pie-terminos">Términos y Condiciones</a>
      <a href="#" id="enlace-pie-ayuda">Centro de Ayuda</a>
      <a href="#" id="enlace-pie-contacto">Contáctanos</a>
    </nav>
    <p class="copyright">&copy; 2026 CINESTAR. Todos los derechos reservados.</p>
  </footer>

</body>

</html>
