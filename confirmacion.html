<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Confirmacion de entradas compradas en CINESTAR.">
  <title>CINESTAR - Confirmacion</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@400;600;900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="confirmacion.css">
  <script src="js/confirmacion.js" defer></script>
</head>

<body>
  <header class="main-header">
    <a href="index.html" class="btn-volver" aria-label="Volver a cartelera">←</a>
    <div class="header-logo" id="logotipo-encabezado">CINESTAR</div>
    <span class="header-espacio" aria-hidden="true"></span>
  </header>

  <main>
    <section class="section-confirmacion" aria-labelledby="titulo-confirmacion">
      <p class="texto-superior">Entrada generada</p>
      <h1 class="section-title" id="titulo-confirmacion">Compra confirmada</h1>

      <article class="mensaje-confirmacion" id="mensaje-confirmacion"></article>
      <article class="ticket-virtual" id="ticket-virtual"></article>

      <a href="index.html" class="btn-volver-cartelera">Volver a cartelera</a>
    </section>
  </main>

  <footer class="main-footer">
    <div class="footer-logo" id="logotipo-pie-id">CINESTAR</div>
    <p class="copyright">&copy; 2026 CINESTAR. Todos los derechos reservados.</p>
  </footer>
</body>

</html>
