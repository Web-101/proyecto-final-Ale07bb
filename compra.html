<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Formulario de compra de entradas en CINESTAR.">
  <title>CINESTAR - Compra</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@400;600;900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="compra.css">
  <script src="js/compra.js" defer></script>
</head>

<body>
  <header class="main-header">
    <a href="index.html" class="btn-volver" aria-label="Volver a cartelera">←</a>
    <div class="header-logo" id="logotipo-encabezado">CINESTAR</div>
    <span class="header-espacio" aria-hidden="true"></span>
  </header>

  <main>
    <section class="section-compra" aria-labelledby="titulo-compra">
      <p class="texto-superior">Finalizar compra</p>
      <h1 class="section-title" id="titulo-compra">Datos del comprador</h1>

      <article class="resumen-pedido" id="resumen-pedido"></article>

      <form class="form-compra" id="form-compra">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

        <label for="correo">Correo electronico</label>
        <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>

        <label for="telefono">Telefono</label>
        <input type="tel" id="telefono" name="telefono" placeholder="Opcional">

        <p class="mensaje-formulario" id="mensaje-formulario" aria-live="polite"></p>

        <button type="submit" class="btn-comprar">Comprar</button>
      </form>

    </section>
  </main>

  <footer class="main-footer">
    <div class="footer-logo" id="logotipo-pie-id">CINESTAR</div>
    <p class="copyright">&copy; 2026 CINESTAR. Todos los derechos reservados.</p>
  </footer>
</body>

</html>
